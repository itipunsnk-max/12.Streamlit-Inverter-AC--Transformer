name: CI

on:
  push:
    branches: [main, implementation-v1]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check src tests app.py pages
      - run: python -m mypy src tests
      - run: python -m compileall -q src tests app.py pages
      - run: python -m pip check
      - run: python -m pytest -p no:cacheprovider --cov=solar_design --cov-report=term-missing --cov-fail-under=75

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m build --wheel --outdir wheelhouse
      - run: python -m pip install --no-deps --force-reinstall wheelhouse/*.whl
      - run: python -c "import importlib.metadata; import solar_design; print(importlib.metadata.version('solar-electrical-design-th'))"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pip_audit --strict --skip-editable
      - run: python -m bandit -q -r src app.py pages

  linux-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -p no:cacheprovider -q tests/phase10/test_linux_smoke.py
