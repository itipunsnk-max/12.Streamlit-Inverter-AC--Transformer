<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Transformer single-line reference</title>
  <desc id="desc">Concept chain from utility high voltage through protection and transformer to the low-voltage main distribution board.</desc>
  <rect width="1200" height="360" fill="#f7f9fc"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0b1f3a">Transformer selection and connection reference</text>
  <text x="60" y="88" font-family="Arial, sans-serif" font-size="17" fill="#526174">Concept only — confirm utility, protection, vector group, fault level, and site layout</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="145" width="170" height="95" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="140" y="185" font-size="20" font-weight="700" fill="#0b1f3a">UTILITY HV</text>
    <text x="140" y="215" font-size="17" fill="#334155">22 kV basis</text>
    <rect x="305" y="145" width="190" height="95" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="400" y="180" font-size="20" font-weight="700" fill="#0b1f3a">HV PROTECTION</text>
    <text x="400" y="210" font-size="17" fill="#334155">Switch / fuse / LA</text>
    <rect x="575" y="125" width="210" height="135" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="4"/>
    <circle cx="650" cy="192" r="35" fill="none" stroke="#059669" stroke-width="4"/>
    <circle cx="710" cy="192" r="35" fill="none" stroke="#059669" stroke-width="4"/>
    <text x="680" y="295" font-size="20" font-weight="700" fill="#0b1f3a">TRANSFORMER</text>
    <text x="680" y="323" font-size="17" fill="#334155">Standard kVA + duty check</text>
    <rect x="865" y="145" width="180" height="95" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="3"/>
    <text x="955" y="180" font-size="20" font-weight="700" fill="#0b1f3a">LV MAIN</text>
    <text x="955" y="210" font-size="17" fill="#334155">400 V MDB</text>
  </g>
  <g stroke="#334155" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M225 192 H295"/>
    <path d="M495 192 H565"/>
    <path d="M795 192 H855"/>
    <path d="M1045 192 H1140"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <text x="1140" y="180" font-family="Arial, sans-serif" font-size="17" text-anchor="end" fill="#334155">Loads / PV AC bus</text>
</svg>
