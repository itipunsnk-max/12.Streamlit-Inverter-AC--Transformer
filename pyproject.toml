[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-electrical-design-th"
version = "0.1.0"
description = "Traceable Streamlit workflow for solar AC electrical design and budgetary transformer installation estimates in Thailand"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "streamlit>=1.56,<2",
  "pandas>=2.3,<3",
  "plotly>=6.7,<7",
  "pydantic>=2.12,<3",
  "XlsxWriter>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "hypothesis>=6.138,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

